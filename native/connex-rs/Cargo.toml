[package]
name = "connex-rs"
version = "0.1.0"
edition = "2021"
description = "Connex-native transport prototype: UCX endpoints keyed by logical id, peer-failure events, same-identity rejoin"
license = "Apache-2.0"

[lib]
name = "connex_rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
libc = "0.2"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
