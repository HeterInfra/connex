# Single-host demo of Connex pipeline parallelism on upstream vLLM (plugin
# connex.adapters.vllm.pp, image built with PP_ENGINE=upstream, the default):
# a 2-stage pipeline whose stage 1 has two replicas. Stage 0 serves the API
# and sends every step to one replica of stage 1; when that replica dies,
# stage 0 moves the route to the other one and the running requests are
# recomputed there. Clients see a delay, not an error.
#
#   export HF_TOKEN=...                       # gated models; MODEL defaults to Llama-3-8B
#   docker compose -f docker/docker-compose.yml up --build -d
#   docker/smoke_test.sh                      # stage 0 on :8000
#   docker compose -f docker/docker-compose.yml kill stage1      # fail over to stage1-r1
#   docker compose -f docker/docker-compose.yml up -d stage1     # back as a spare
#
# GPUs: stage 0 on GPU0, stage 1 replicas on GPU1 and GPU2 (GPU0/GPU1/GPU2,
# default 0, 1, 2). One replica only: up -d stage1 stage0.
# A local model directory instead of a Hugging Face download: add
#   -f docker/compose.local-model.yml with MODEL_DIR=/path/to/model
# Every stage must use the same NUM_GPU_BLOCKS (block ids in the steps are
# stage 0's). connex-rs uses TCP here (UCX_TLS); for RDMA mount
# /dev/infiniband (commented lines) and drop the UCX_TLS override.
# All services use the host network so the connex-rs ports are reachable
# without port mappings.
#
# Legacy external-PP fork demo (front-router, two full replicas):
# docker/docker-compose.fork.yml, image built with PP_ENGINE=fork.

x-stage: &stage
  image: ${CONNEX_IMAGE:-connex-vllm:dev}
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      PP_ENGINE: upstream
      BASE_IMAGE: ${BASE_IMAGE:-vllm/vllm-openai:latest}
      VLLM_REF: ${VLLM_REF:-main}
      VLLM_INSTALL: ${VLLM_INSTALL:-precompiled}
  network_mode: host
  ipc: host
  shm_size: 16gb
  volumes:
    # Hugging Face cache shared by the stages (downloads happen once)
    - ${HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
  # devices: ["/dev/infiniband:/dev/infiniband"]   # RDMA
  # cap_add: [IPC_LOCK]
  environment: &stage_env
    PP_ENGINE: upstream
    NUM_STAGES: "2"
    MODEL_PATH: ${MODEL:-meta-llama/Meta-Llama-3-8B}
    MODEL_NAME: ${MODEL_NAME:-connex-demo}
    HF_TOKEN: ${HF_TOKEN:-}
    HOST_IP: 127.0.0.1
    GPU_SELECT: none
    NUM_GPU_BLOCKS: ${NUM_GPU_BLOCKS:-8192}
    GPU_MEM_UTIL: ${GPU_MEM_UTIL:-0.75}
    UCX_TLS: ${UCX_TLS:-tcp,sm,self,cuda_copy,cuda_ipc}
    UCX_WARN_UNUSED_ENV_VARS: "n"
    VLLM_USE_FLASHINFER_SAMPLER: "0"

services:
  # stage 1, replica 0 (preferred route) and replica 1 (spare)
  stage1:
    <<: *stage
    environment:
      <<: *stage_env
      STAGE: "1"
      REPLICA: "0"
      CONTROL_PORT: "48000"
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${GPU1:-1}"], capabilities: [gpu]}]

  stage1-r1:
    <<: *stage
    environment:
      <<: *stage_env
      STAGE: "1"
      REPLICA: "1"
      CONTROL_PORT: "48016"
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${GPU2:-2}"], capabilities: [gpu]}]

  # stage 0: OpenAI API on :8000, scheduler, route to one stage-1 replica
  stage0:
    <<: *stage
    depends_on: [stage1]
    environment:
      <<: *stage_env
      STAGE: "0"
      API_PORT: "8000"
      PP_STAGES: '[["127.0.0.1:48000","127.0.0.1:48016"]]'
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${GPU0:-0}"], capabilities: [gpu]}]
