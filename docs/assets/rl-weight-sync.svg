<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Elastic versioned weight sync">
  <title>Elastic versioned weight sync with connex.rl</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .bg { fill: #ffffff; }
    .st { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .tr { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .rg { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .dead { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .join { fill: #ecfdf5; stroke: #0d9488; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .t { font-size: 14px; font-weight: 600; } .s { font-size: 12px; fill: #475569; }
    .rd { stroke: #2563eb; stroke-width: 2; fill: none; } .rdh { fill: #2563eb; }
    .fo { stroke: #ea580c; stroke-width: 2.5; fill: none; } .foh { fill: #ea580c; }
    .ct { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 3 3; }
    .x { stroke: #dc2626; stroke-width: 4; stroke-linecap: round; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .bg { fill: #0d1117; }
      .st { fill: #0c2244; stroke: #58a6ff; } .tr { fill: #2b1606; stroke: #fb923c; }
      .rg { fill: #161b22; stroke: #8b949e; } .dead { fill: #2d1214; stroke: #f87171; }
      .join { fill: #062b26; stroke: #2dd4bf; } .s { fill: #9ca3af; }
      .rd { stroke: #58a6ff; } .rdh { fill: #58a6ff; } .x { stroke: #f87171; }
    }
  </style>
  <rect class="bg" width="880" height="400"/>
  <rect class="tr" x="40" y="150" width="170" height="70" rx="8"/>
  <text class="t" x="125" y="178" text-anchor="middle">trainer</text>
  <text class="s" x="125" y="198" text-anchor="middle">publishes version v</text>
  <text class="s" x="125" y="212" text-anchor="middle">(registered arena)</text>
  <rect class="rg" x="330" y="20" width="220" height="56" rx="8"/>
  <text class="t" x="440" y="44" text-anchor="middle">weight registry</text>
  <text class="s" x="440" y="62" text-anchor="middle">members, versions, holders of v</text>
  <path class="ct" d="M125 150 V 48 H 330"/>
  <rect class="st" x="330" y="120" width="160" height="56" rx="8"/>
  <text class="t" x="410" y="144" text-anchor="middle">engine A</text>
  <text class="s" x="410" y="162" text-anchor="middle">pulled v, now a source</text>
  <rect class="st" x="330" y="230" width="160" height="56" rx="8"/>
  <text class="t" x="410" y="254" text-anchor="middle">engine B</text>
  <text class="s" x="410" y="272" text-anchor="middle">pulled v, now a source</text>
  <path class="rd" d="M330 148 H 222"/><polygon class="rdh" points="214,148 224,143 224,153"/>
  <path class="rd" d="M330 258 C 280 258 260 215 222 205"/><polygon class="rdh" points="214,203 225,201 222,211"/>
  <rect class="dead" x="640" y="100" width="190" height="56" rx="8"/>
  <text class="t" x="735" y="124" text-anchor="middle">engine C (dies)</text>
  <text class="s" x="735" y="142" text-anchor="middle">was serving v to D</text>
  <line class="x" x1="815" y1="106" x2="827" y2="118"/><line class="x" x1="827" y1="106" x2="815" y2="118"/>
  <rect class="st" x="640" y="200" width="190" height="56" rx="8"/>
  <text class="t" x="735" y="224" text-anchor="middle">engine D</text>
  <text class="s" x="735" y="242" text-anchor="middle">re-reads the rest from A</text>
  <path class="ct" d="M735 200 V 156"/>
  <path class="fo" d="M640 228 C 570 228 540 160 502 152"/><polygon class="foh" points="492,150 503,146 501,157"/>
  <rect class="join" x="640" y="300" width="190" height="56" rx="8"/>
  <text class="t" x="735" y="324" text-anchor="middle">engine E joins</text>
  <text class="s" x="735" y="342" text-anchor="middle">catches up to latest v first</text>
  <path class="rd" d="M640 328 C 570 328 540 280 502 268"/><polygon class="rdh" points="492,265 503,263 501,273"/>
  <text class="cap" x="40" y="388">One-sided reads of byte ranges (connex-rs); finished engines serve the next ones; a dead source is replaced and the pull continues.</text>
</svg>
