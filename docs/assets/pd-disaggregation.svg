<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="Prefill-decode disaggregation with Connex">
  <title>Prefill-decode disaggregation with Connex: elastic pools, renewable KV holds, decode failover</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .bg { fill: #ffffff; }
    .st { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .cp { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
    .dead { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .new { fill: #ecfdf5; stroke: #0d9488; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .pool { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .t { font-size: 14px; font-weight: 600; } .s { font-size: 12px; fill: #475569; }
    .rl { font-size: 13px; font-weight: 700; fill: #475569; }
    .ln { stroke: #64748b; stroke-width: 2; fill: none; } .lh { fill: #64748b; }
    .kv { stroke: #2563eb; stroke-width: 3; fill: none; } .kh { fill: #2563eb; }
    .ho { stroke: #ea580c; stroke-width: 2.5; fill: none; stroke-dasharray: 7 4; } .hh { fill: #ea580c; }
    .mb { stroke: #7c3aed; stroke-width: 1.5; fill: none; stroke-dasharray: 2 3; }
    .x { stroke: #dc2626; stroke-width: 4; stroke-linecap: round; }
    .n { fill: #ea580c; } .nt { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .bg { fill: #0d1117; }
      .st { fill: #0c2244; stroke: #58a6ff; } .cp { fill: #1e1538; stroke: #a78bfa; }
      .dead { fill: #2d1214; stroke: #f87171; } .new { fill: #062b26; stroke: #2dd4bf; }
      .s, .rl { fill: #9ca3af; } .pool { stroke: #6b7280; }
      .ln { stroke: #8b949e; } .lh { fill: #8b949e; } .kv { stroke: #58a6ff; } .kh { fill: #58a6ff; }
      .mb { stroke: #a78bfa; } .x { stroke: #f87171; } .nt { fill: #ffffff; }
    }
  </style>
  <rect class="bg" width="880" height="470"/>

  <!-- router and front-router -->
  <rect class="st" x="300" y="20" width="250" height="56" rx="8"/>
  <text class="t" x="425" y="44" text-anchor="middle">PD router</text>
  <text class="s" x="425" y="62" text-anchor="middle">connex.serving.pd_router</text>
  <rect class="cp" x="640" y="20" width="200" height="56" rx="8"/>
  <text class="t" x="740" y="44" text-anchor="middle">front-router</text>
  <text class="s" x="740" y="62" text-anchor="middle">PD pools: leases, join / leave</text>
  <path class="mb" d="M640 48 H 558"/><polygon class="lh" points="550,48 560,43 560,53"/>

  <!-- prefill pool -->
  <rect class="pool" x="40" y="120" width="300" height="130" rx="10"/>
  <text class="rl" x="52" y="140">prefill pool</text>
  <rect class="st" x="56" y="152" width="128" height="80" rx="8"/>
  <text class="t" x="120" y="176" text-anchor="middle">prefill 0</text>
  <text class="s" x="120" y="194" text-anchor="middle">LID (m, P, 0, 0)</text>
  <text class="s" x="120" y="212" text-anchor="middle">holds KV of T (lease)</text>
  <rect class="new" x="198" y="152" width="128" height="80" rx="8"/>
  <text class="t" x="262" y="176" text-anchor="middle">prefill 1</text>
  <text class="s" x="262" y="194" text-anchor="middle">joins: probed, then</text>
  <text class="s" x="262" y="212" text-anchor="middle">takes traffic</text>

  <!-- decode pool -->
  <rect class="pool" x="420" y="300" width="430" height="130" rx="10"/>
  <text class="rl" x="432" y="320">decode pool</text>
  <rect class="dead" x="436" y="332" width="128" height="80" rx="8"/>
  <text class="t" x="500" y="356" text-anchor="middle">decode 0</text>
  <text class="s" x="500" y="374" text-anchor="middle">dies after k tokens</text>
  <path class="x" d="M548 340 l 12 12 M560 340 l -12 12"/>
  <rect class="st" x="578" y="332" width="140" height="80" rx="8"/>
  <text class="t" x="648" y="356" text-anchor="middle">decode 1</text>
  <text class="s" x="648" y="374" text-anchor="middle">re-acquires T, pulls</text>
  <text class="s" x="648" y="392" text-anchor="middle">the prompt KV again</text>
  <rect class="st" x="728" y="332" width="112" height="80" rx="8"/>
  <text class="t" x="784" y="356" text-anchor="middle">decode 2</text>
  <text class="s" x="784" y="374" text-anchor="middle">LID (m, D, 0, 2)</text>

  <!-- request flow -->
  <path class="ln" d="M330 76 L 150 146"/><polygon class="lh" points="144,149 152,141 155,151"/>
  <circle class="n" cx="232" cy="104" r="10"/><text class="nt" x="232" y="108" text-anchor="middle">1</text>
  <text class="s" x="96" y="104">prefill, max_tokens 1</text>
  <path class="ln" d="M440 76 L 498 326"/><polygon class="lh" points="500,332 494,323 504,322"/>
  <circle class="n" cx="482" cy="200" r="10"/><text class="nt" x="482" y="204" text-anchor="middle">2</text>
  <text class="s" x="384" y="226">decode + kv_transfer_params</text>

  <!-- KV pulls -->
  <path class="kv" d="M120 232 C 120 300, 300 372, 428 372"/><polygon class="kh" points="436,372 425,366 425,378"/>
  <circle class="n" cx="230" cy="318" r="10"/><text class="nt" x="230" y="322" text-anchor="middle">3</text>
  <text class="s" x="40" y="400">3: one-sided reads</text>
  <text class="s" x="40" y="416">(connex-rs, GPUDirect)</text>
  <path class="ho" d="M150 232 C 200 440, 520 452, 610 416"/><polygon class="hh" points="617,413 605,411 609,421"/>
  <circle class="n" cx="380" cy="446" r="10"/><text class="nt" x="380" y="450" text-anchor="middle">4</text>
  <text class="s" x="396" y="452">resume: same T, re-pull; prefill again only if the hold is gone</text>

  </svg>
